server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Audio uploads (POST /api/episodes/upload) can be long episodes.
  client_max_body_size 2g;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Server-sent events for /api/chat: no buffering, long reads.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    # Stream uploads straight to the backend instead of spooling them in nginx first.
    proxy_request_buffering off;
    add_header X-Accel-Buffering no;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The page shell must never be served stale after a rebuild; the hashed bundles
  # it points to can be cached forever.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
