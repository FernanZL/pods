[project]
name = "podcast-rag"
version = "0.1.0"
description = "Local RAG chatbot over podcast episodes"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "pymupdf>=2.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# hand-written sample prose
"scripts/sample_book.py" = ["E501"]
